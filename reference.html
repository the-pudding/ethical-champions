<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Matter.js Pile Simulation</title>
	<style>
		html,
		body {
			margin: 0;
			background: #fff;
			font-family: "Segoe UI", Arial, sans-serif;
		}

		.scene-section {
			width: 100%;
			height: 100vh;
			position: relative;
			overflow: hidden;
		}

		.hud {
			position: absolute;
			top: 12px;
			left: 12px;
			padding: 8px 10px;
			font-size: 12px;
			color: #000;
			background: rgba(255, 255, 255, 0.8);
			border: 1px solid rgba(0, 0, 0, 0.15);
			border-radius: 8px;
			backdrop-filter: blur(3px);
			z-index: 10;
		}
	</style>
</head>
<body>
	<div class="scene-section" id="scene1">
		<div class="hud">rectangular bin</div>
	</div>

	<div class="scene-section" id="scene2">
		<div class="hud">upside-down triangle</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
	<script>
		const vertices = [
			{ x: 3.23, y: 113.2 },
			{ x: 19.41, y: 54.98 },
			{ x: 71.16, y: 6.47 },
			{ x: 142.31, y: 6.47 },
			{ x: 181.13, y: 35.58 },
			{ x: 197.3, y: 71.16 },
			{ x: 203.77, y: 132.61 },
			{ x: 187.59, y: 236.11 },
			{ x: 161.72, y: 242.58 },
			{ x: 42.05, y: 242.58 },
			{ x: 12.94, y: 239.34 }
		];

		const {
			Engine,
			Render,
			Runner,
			Bodies,
			Composite,
			Common,
			Bounds,
			Body
		} = Matter;

		function makeCenteredVertices(targetWidth) {
			const sourceBounds = Bounds.create(vertices);
			const sourceWidth = sourceBounds.max.x - sourceBounds.min.x;
			const sourceHeight = sourceBounds.max.y - sourceBounds.min.y;
			const scale = targetWidth / sourceWidth;
			return vertices.map((v) => ({
				x: (v.x - (sourceBounds.min.x + sourceWidth / 2)) * scale,
				y: (v.y - (sourceBounds.min.y + sourceHeight / 2)) * scale
			}));
		}

		function spawnBodies(centeredVerts, count, dropXMin, dropXMax, containerWidth, spriteImg) {
			const bodies = [];
			for (let i = 0; i < count; i++) {
				const x = dropXMin + (dropXMax - dropXMin) / 2;
				const y = 20 - i * 95;
				const body = Bodies.fromVertices(x, y, [centeredVerts], {
					restitution: 0.12,
					friction: 0.55,
					frictionAir: 0.012,
					density: 0.0018,
					render: {
						fillStyle: "#fff",
						strokeStyle: "#fff",
						lineWidth: 1,
						sprite: {
							texture: "./trim.png",
							xScale: 1,
							yScale: 1
						}
					}
				}, true);
				Body.rotate(body, Common.random(-0.5, 0.5));
				bodies.push(body);
			}
			if (spriteImg && spriteImg.complete) fitSprites(bodies, spriteImg);
			return bodies;
		}

		function fitSprites(bodies, image) {
			bodies.forEach((body) => {
				const bounds = body.bounds;
				const bw = bounds.max.x - bounds.min.x;
				const bh = bounds.max.y - bounds.min.y;
				body.render.sprite.xScale = bw / image.naturalWidth;
				body.render.sprite.yScale = bh / image.naturalHeight;
			});
		}

		function angledWall(p1, p2, thickness = 24) {
			const cx = (p1.x + p2.x) / 2;
			const cy = (p1.y + p2.y) / 2;
			const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
			const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
			return Bodies.rectangle(cx, cy, len, thickness, {
				isStatic: true,
				angle,
				render: { fillStyle: "#fff" }
			});
		}

		// ── Scene 1: rectangular bin ──────────────────────────────────────────
		(function () {
			const el = document.getElementById("scene1");
			const width = el.clientWidth;
			const height = el.clientHeight;

			const engine = Engine.create({ gravity: { x: 0, y: 1.0 } });
			const render = Render.create({
				element: el,
				engine,
				options: { width, height, wireframes: false, background: "#fff", pixelRatio: window.devicePixelRatio || 1 }
			});

			const wt = 60;
			const containerTop = 120;

			const floor = Bodies.rectangle(width / 2, height + wt / 2, width, wt, { isStatic: true, render: { fillStyle: "#fff" } });
			const leftWall = Bodies.rectangle(-wt / 2, height / 2, wt, height * 2, { isStatic: true, render: { fillStyle: "#fff" } });
			const rightWall = Bodies.rectangle(width + wt / 2, height / 2, wt, height * 2, { isStatic: true, render: { fillStyle: "#fff" } });
			// Walls lean slightly inward: top edge closer to center than bottom edge
			const binLeft  = angledWall({ x: width * 0.4, y: containerTop }, { x: width * 0.22, y: height - 14 });
			const binRight = angledWall({ x: width * 0.6, y: containerTop }, { x: width * 0.78, y: height - 14 });
			const binBottom = Bodies.rectangle(width / 2, height - 14, width * 0.56, 28, { isStatic: true, render: { fillStyle: "#2a2d3e" } });

			Composite.add(engine.world, [floor, leftWall, rightWall, binLeft, binRight, binBottom]);

			const cv = makeCenteredVertices(width * 0.05);
			const spriteImg = new Image();
			const bodies = spawnBodies(cv, 100, width * 0.34, width * 0.66, width * 0.05, spriteImg);
			spriteImg.onload = () => fitSprites(bodies, spriteImg);
			spriteImg.src = "./trim.png";

			Composite.add(engine.world, bodies);
			Render.run(render);
			Runner.run(Runner.create(), engine);
		})();
	</script>
</body>
</html>
